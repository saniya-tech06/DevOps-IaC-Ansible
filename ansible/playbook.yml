---
- name: Configure Application Server
  hosts: webservers
  become: true

  tasks:
    - name: Install required packages
      apt:
        name:
          - nginx
          - curl
        state: present
        update_cache: true

    - name: Create application user
      user:
        name: devops
        state: present
        shell: /bin/bash
        create_home: true

    - name: Configure application web page
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>DevOps Application Server</title>
          </head>
          <body>
              <h1>Application Server Configured by Ansible</h1>
              <p>Version 2 - Configuration Updated by Ansible</p>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Ensure nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: true