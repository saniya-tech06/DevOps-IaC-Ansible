---
- name: Configure Web Server
  hosts: webservers
  become: true

  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Create devops user
      user:
        name: devops
        state: present

    - name: Start nginx service
      service:
        name: nginx
        state: started
        enabled: true